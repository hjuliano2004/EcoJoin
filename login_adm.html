<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo</title>
    <link rel="stylesheet" href="./css/login_adm.css">
    

</head>

<body>

    <div class="container">
        <div class="imagem">
        <img src="./imgLand/b1.png" alt="Logo EcoJoin">
</div>
        <div class="formulario-direito">
            <h1>Login Administrativo</h1>
            <br>

            <form class="formulario">

                <label for="email">E-mail:</label>
                <input type="text" id="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>

                <button id="entrar">Entrar</button>
                <img src="./imgLand/logo_landing.png" alt="Logo EcoJoin" class="logo">
            </form>
        </div>
    </div>

    <script src="./js/login_adm.js"></script>
</body>

</html>
