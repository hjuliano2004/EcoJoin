<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo</title>
    <link rel="stylesheet" href="login_adm.css">
    <script src="login_adm.js"></script>

</head>

<body>

    <div class="container">
        <div class="imagem">
        <img src="b1.png" alt="Logo EcoJoin">
</div>
        <div class="formulario-direito">
            <h1>Login Administrativo</h1>
            <br>

            <form class="formulario">

                <label for="email">E-mail:</label>
                <input type="text" id="email">

                <label for="senha">Senha:</label>
                <input type="password" id="senha">

                <button id="entrar" disabled>Entrar</button>
                <img src="logo_landing.png" alt="Logo EcoJoin" class="logo">
            </form>
        </div>
    </div>


</body>

</html>
